<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brands</title>
    <style>
    *{
       margin: 0;
       padding: 0;
       box-sizing: border-box;
       font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }
    body{
        background-color: aliceblue;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        

    }
    .main{
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background-color: white;
        width: 90%;
        max-width: 540px;
        padding: 5px 4px;
        text-align: center;
        min-height: 480px;
        border: 0.5 solid gold;
        border-radius: 25px;
    }

    .plite{
        
        font-weight: bold;
        background-color: rgba(220, 220, 220, 0.568);
        padding: 5px;
        margin: 0px 60px;
        border-radius: 50px;
        border: 1px solid gray;
        font-size: 12px;
    }

    .plite span{
        animation: pop 8s ease-in-out infinite;
    }

    @keyframes pop{
        0%{
            opacity: 1;
            font-size: 8px;
            transition: all 0.5s;
        }
        50%{
            opacity: 0.5;
            font-size: 5px;
            transition: all 0.5s;
        }
        100%{
        opacity: 1;
        font-size: 8px;
        transition: all 0.5s;
        }
    }

    h1{
       font-size: 52px;
      font-weight: 600;
      letter-spacing: -2px;
      color: #111;
      margin-bottom: 0.5rem;
      line-height: 1;
    }

    h1 span{
        color: #1D9E75;
    }

    .ppp{
        font-size: 15px;
      color: #888;
      margin-bottom: 2.5rem;
      font-weight: 400;
    }

    .divhr{
        width: 40px;
      height: 1.5px;
      background: rgba(0,0,0,0.15);
      margin: 0 auto 2rem;
      border-radius: 2px;
    }

    input{
        flex: 1;
      height: 38px;
      border-radius: 8px 8px 8px 0px;
      border-top-left-radius: 0px;
      border: 0.5px solid rgba(0,0,0,0.18);
      padding: 0 12px;
      font-size: 14px;
      background: #f5f5f3;
      color: #111;
      outline: none;
      font-family: inherit;
    }

    input:focus{border-color: #1D9E75;}

    .button{
        height: 38px;
      padding: 0 16px;
      background: #1D9E75;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
      font-family: inherit;
       border-radius: 8px 8px 0px 8px;
      border-top-right-radius: 0px;
    }

    .back{
        height: 200px;
        width: 200px;
        position:relative;
        z-index: 1;
        border-radius: 50%;
        background-color: #1d9e7557;
        top: -100px;
        right: -250px;
    }
    
    </style>
</head>
<body>
    <div class="main">
        <div class="back"></div>
        <div class="form">
            <p class="plite">قريباَ <span> 🟢</span></p>
            <br>
            <h1>orvi<span>x</span></h1>
            <p class="ppp">شيء مميز قادم قريباً</p>
            <form>
                <div class="divhr"></div>
                <input type="button" class="button" onclick="send()" value="أبلغني">
                 <input type="text" id="emailin" placeholder="enter your email...">
            </form>
        </div>
        <br><br><br><br>
    <p class="cs-footer">© 2026 Orvix — جميع الحقوق محفوظة</p></div>
    </div>
    <script src="op.js"></script>

</body>
</html>
